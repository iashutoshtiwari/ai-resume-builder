name: Build and Push LaTeX Compiler Image

on:
  push:
    branches: [main]
    paths:
      - "docker/latex-compiler/**"
      - ".github/workflows/docker-build-push.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repository owner for image tag
        id: repo-owner
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT

      - name: Build and push container image
        uses: docker/build-push-action@v5
        with:
          context: ./docker/latex-compiler
          push: true
          tags: |
            ghcr.io/${{ steps.repo-owner.outputs.owner }}/resume-latex-compiler:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
